<!doctype html>
<html lang="en" data-lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Sprint Board</title>
    <script>
      try {
        var t = JSON.parse(localStorage.getItem('sprint-board-theme'));
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
        if (JSON.parse(localStorage.getItem('sprint-board-nav')) === 'rail')
          document.documentElement.setAttribute('data-nav', 'rail');
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@400;600;700&family=Atkinson+Hyperlegible+Next:wght@400;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400..700;1,8..60,400&display=swap"
    />
    <link rel="stylesheet" href="/app.css" data-inline="css" />
  </head>
  <body>
    <div id="demo-bar" class="demo-bar" hidden>Demo sprint · invented data · Esc to exit</div>
    <div class="shell">
      <nav class="side" id="side-nav" aria-label="Views">
        <div class="brand">
          <span class="brand-id"
            ><span class="brand-logo" role="img" aria-label="__BRAND_NAME__"><!--BRAND_LOGO--></span
            ><b>Sprint Board</b></span
          >
          <button
            class="nav-toggle"
            type="button"
            id="nav-collapse"
            aria-controls="side-nav"
            aria-expanded="true"
            title="Collapse the menu (Ctrl+B)"
          >
            <svg viewBox="0 0 16 16" aria-hidden="true">
              <rect x="2" y="2.5" width="12" height="11" rx="1.5" />
              <path d="M6 2.5v11M10.5 6 8.5 8l2 2" />
            </svg>
            <span class="sr">Collapse the menu</span>
          </button>
        </div>
        <a href="#now" data-view="now"
          ><svg class="ico" viewBox="0 0 16 16" aria-hidden="true">
            <circle cx="8" cy="8" r="6" />
            <path d="M8 4.5V8l2.5 1.5" /></svg
          ><span class="nav-label">Now</span><kbd>1</kbd></a
        >
        <a href="#metrics" data-view="metrics"
          ><svg class="ico" viewBox="0 0 16 16" aria-hidden="true">
            <path d="M2.5 13.5h11M4.5 11V8M8 11V4M11.5 11V6.5" /></svg
          ><span class="nav-label">Metrics</span><kbd>2</kbd></a
        >
        <a href="#people" data-view="people"
          ><svg class="ico" viewBox="0 0 16 16" aria-hidden="true">
            <circle cx="6" cy="5.5" r="2.3" />
            <path
              d="M1.8 13c.5-2.4 2.2-3.6 4.2-3.6s3.7 1.2 4.2 3.6M10.6 3.4a2.2 2.2 0 0 1 0 4.2M12 9.6c1.2.5 2 1.6 2.3 3.4"
            /></svg
          ><span class="nav-label">People</span><span class="count" id="people-count" hidden></span
          ><kbd>3</kbd></a
        >
        <a href="#tickets" data-view="tickets"
          ><svg class="ico" viewBox="0 0 16 16" aria-hidden="true">
            <rect x="2.5" y="2.5" width="11" height="11" rx="1.5" />
            <path d="M5 6h6M5 8.5h6M5 11h3.5" /></svg
          ><span class="nav-label">Tickets</span><kbd>4</kbd></a
        >
        <a href="#bugs" data-view="bugs"
          ><svg class="ico" viewBox="0 0 16 16" aria-hidden="true">
            <rect x="5" y="5" width="6" height="8" rx="3" />
            <path
              d="M8 7.5V13M6 5c0-1.2.9-2 2-2s2 .8 2 2M5 8H2.5M13.5 8H11M5.3 11.3 3 13M10.7 11.3 13 13M5.3 6.2 3.4 4.6M10.7 6.2l1.9-1.6"
            /></svg
          ><span class="nav-label">Bugs</span
          ><span class="count bug-count" id="bugs-count" hidden></span><kbd>5</kbd></a
        >
        <a href="#timeline" data-view="timeline"
          ><svg class="ico" viewBox="0 0 16 16" aria-hidden="true">
            <path d="M4 2.5v11M4 5h8.5M4 10.5h6" />
            <circle cx="4" cy="5" r="1.2" />
            <circle cx="4" cy="10.5" r="1.2" /></svg
          ><span class="nav-label">Timeline</span><kbd>6</kbd></a
        >
        <a href="#evidence" data-view="evidence"
          ><svg class="ico" viewBox="0 0 16 16" aria-hidden="true">
            <rect x="2" y="3" width="12" height="10" rx="1.5" />
            <circle cx="6" cy="6.5" r="1.2" />
            <path d="m2.5 12 3.8-3.8 2.6 2.6 1.6-1.6 3 3" /></svg
          ><span class="nav-label">Evidence</span><kbd>7</kbd></a
        >
        <a href="#history" data-view="history"
          ><svg class="ico" viewBox="0 0 16 16" aria-hidden="true">
            <rect x="2" y="3" width="12" height="3" rx="1" />
            <path d="M3 6v6.5a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1V6M6.5 9h3" /></svg
          ><span class="nav-label">History</span><kbd>8</kbd></a
        >
        <a href="#merge" data-view="merge"
          ><svg class="ico" viewBox="0 0 16 16" aria-hidden="true">
            <path d="M2 4.5h7.5c2 0 3 1 3 3V13M2 9h4.5c2 0 3 1 3 3v1M14 13H1.5" />
            <circle cx="5" cy="4.5" r="1.2" />
            <circle cx="4" cy="9" r="1.2" /></svg
          ><span class="nav-label">Merge Line</span
          ><span class="count" id="merge-count" hidden></span><kbd>9</kbd></a
        >
        <a href="#report" data-view="report" hidden
          ><svg class="ico" viewBox="0 0 16 16" aria-hidden="true">
            <path d="M4 1.5h5.5L12.5 4.5v10h-8.5z" />
            <path d="M6.5 11.5v-2M8.5 11.5V7.5M10.5 11.5v-3" /></svg
          ><span class="nav-label">Report</span><kbd>9</kbd></a
        >
        <div class="side-foot">
          <button
            class="btn"
            type="button"
            id="copy-slack"
            title="Ticket, Priority, Developer, Title, Status"
          >
            Copy for Slack
          </button>
          <button class="btn ghost" type="button" id="alerts-btn" hidden>Enable alerts</button>
          <p class="nav-hint"><kbd>Ctrl</kbd>/<kbd>⌘</kbd> <kbd>B</kbd> hides this menu</p>
        </div>
      </nav>
      <main id="main">
        <header class="topbar">
          <button
            class="nav-toggle phone-only"
            type="button"
            id="nav-open"
            aria-controls="side-nav"
            aria-expanded="false"
            title="Menu (Ctrl+B)"
          >
            <svg viewBox="0 0 16 16" aria-hidden="true">
              <path d="M2.5 4h11M2.5 8h11M2.5 12h11" />
            </svg>
            <span class="sr">Open the menu</span>
          </button>
          <h1 id="sprint-name">Sprint Board</h1>
          <span class="chip" id="sprint-day"></span>
          <span class="chip" id="env-chip"></span>
          <span class="chip watch-chip" id="watch-chip" hidden></span>
          <span class="spacer"></span>
          <input
            class="search"
            id="search"
            type="search"
            placeholder="Filter  ⌘K"
            aria-label="Filter tickets"
          />
          <span class="chip" id="live-chip"
            ><span class="live-dot off" id="live-dot"></span
            ><span id="live-text">connecting</span></span
          >
          <span class="theme-seg" role="group" aria-label="Theme">
            <button type="button" data-set-theme="auto" aria-pressed="true">
              <svg viewBox="0 0 16 16" aria-hidden="true">
                <circle cx="8" cy="8" r="6" />
                <path d="M8 2a6 6 0 0 0 0 12z" fill="currentColor" /></svg
              ><span>Auto</span>
            </button>
            <button type="button" data-set-theme="light" aria-pressed="false">
              <svg viewBox="0 0 16 16" aria-hidden="true">
                <circle cx="8" cy="8" r="3" />
                <path
                  d="M8 1.5v1.8M8 12.7v1.8M1.5 8h1.8M12.7 8h1.8M3.4 3.4l1.3 1.3M11.3 11.3l1.3 1.3M3.4 12.6l1.3-1.3M11.3 4.7l1.3-1.3"
                /></svg
              ><span>Light</span>
            </button>
            <button type="button" data-set-theme="dark" aria-pressed="false">
              <svg viewBox="0 0 16 16" aria-hidden="true">
                <path d="M13.5 9.6A5.8 5.8 0 0 1 6.4 2.5a5.8 5.8 0 1 0 7.1 7.1z" /></svg
              ><span>Dark</span>
            </button>
          </span>
        </header>
        <div id="stale" class="stale" hidden></div>
        <div id="view"></div>
        <footer class="foot">
          <span id="foot-source"></span>
          <span id="foot-tracker"></span>
          <span class="spacer"></span>
          <span class="lang" aria-label="Language"
            ><button type="button" data-set-lang="en" aria-pressed="true">EN</button>·<button
              type="button"
              data-set-lang="es"
              aria-pressed="false"
            >
              ES
            </button></span
          >
        </footer>
      </main>
    </div>
    <div id="scrim" class="scrim" hidden></div>
    <div id="nav-scrim" class="scrim nav-scrim" hidden></div>
    <aside id="drawer" class="drawer" hidden aria-label="Ticket detail">
      <div
        class="drawer-handle"
        id="drawer-handle"
        role="separator"
        tabindex="0"
        aria-orientation="vertical"
        aria-label="Resize the panel (arrow keys, double-click resets)"
        aria-controls="drawer"
        title="Drag to resize · double-click resets"
      ></div>
      <div class="drawer-body" id="drawer-body"></div>
    </aside>
    <div id="lightbox" class="lightbox" hidden><img alt="" /></div>
    <div id="toast" role="status" hidden></div>
    <button type="button" class="tour-fab" id="tour-fab"><i></i><span>Tour</span></button>
    <script id="board-data" type="application/json"></script>
    <script src="/app.js" data-inline="js"></script>
  </body>
</html>
